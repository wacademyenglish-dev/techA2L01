<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOLF LABS TECH | Evolution of Hardware (A2)</title>
    
    <!-- Epic & Tech Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;800;900&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- WOLF LABS ENGINE V2.2: TECH SPECIALIZED (PURPLE PALETTE) --- */
        :root {
            --bg: #030008;
            --surface: rgba(17, 10, 30, 0.85);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(168, 85, 247, 0.2);
            --accent: #A855F7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --correct: #1DB954;
            --incorrect: #E50914; 
            --text-main: #FFFFFF;
            --text-dim: #A1A1AA;
            --font-display: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 0%, rgba(40, 10, 70, 0.5) 0%, rgba(3,0,8,1) 80%),
                        linear-gradient(0deg, rgba(3,0,8,1) 0%, rgba(3,0,8,0.9) 100%),
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- AMBIENT ORBS --- */
        .ambient-orbs {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden; pointer-events: none;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.2;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 600px; height: 600px; background: var(--accent); top: -20%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: #4F46E5; bottom: -20%; right: -10%; animation-delay: -5s; }

        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }

        /* --- LAYOUT FULL-SCREEN --- */
        main {
            flex: 1; width: 100%; max-width: 1200px; margin: 0 auto;
            padding-top: 100px; padding-bottom: 150px;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 10;
        }
        
        .step {
            position: absolute; width: 100%; max-width: 950px;
            opacity: 0; pointer-events: none; transform: scale(0.96);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            visibility: hidden;
            max-height: 80vh; overflow-y: auto; padding: 20px;
            scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
        }
        .step::-webkit-scrollbar { width: 4px; }
        .step::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        
        .step.active {
            opacity: 1; pointer-events: auto; transform: scale(1);
            visibility: visible; position: relative;
        }

        /* --- GLASSMORPHISM PANELS --- */
        .glass-panel {
            background: linear-gradient(135deg, rgba(25,15,40,0.85) 0%, rgba(10,5,20,0.95) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(168, 85, 247, 0.2);
            padding: 50px;
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .dual-panel { display: flex; gap: 50px; align-items: center; width: 100%; }
        .dual-panel > * { flex: 1; }
        .divider { width: 2px; height: 200px; background: linear-gradient(to bottom, transparent, var(--accent), transparent); opacity: 0.3; }
        @media (max-width: 850px) { .dual-panel { flex-direction: column; gap: 30px; } .divider { display: none; } }

        /* --- TYPOGRAPHY & BUTTONS --- */
        h1, h2, h3 { font-family: var(--font-display); letter-spacing: -1px; margin-bottom: 20px;}
        h1 { font-size: 5rem; line-height: 1.1; color: #fff; font-weight: 900; }
        h2 { font-size: 2.2rem; color: var(--accent); display: flex; align-items: center; gap: 15px; font-weight: 800;}
        p { font-size: 1.2rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.7;}

        .code-tag { font-family: var(--font-code); color: var(--accent); font-size: 0.9rem; background: rgba(168, 85, 247, 0.1); padding: 4px 10px; border-radius: 6px; letter-spacing: 0; }

        .btn {
            padding: 18px 45px; border: none; border-radius: 12px; font-family: var(--font-code);
            font-size: 1.1rem; font-weight: 700; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 10px;
            background: #fff; color: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-accent { background: var(--accent); color: #000; box-shadow: 0 10px 30px var(--accent-glow); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px var(--accent-glow); }
        .btn:disabled { opacity: 0.3; pointer-events: none; }

        /* --- SOLID ACCENT BOXES --- */
        .solid-accent-box {
            background: var(--accent) !important;
            color: #050505 !important;
            box-shadow: 0 10px 30px var(--accent-glow);
            border: none;
        }
        .solid-accent-box h3, .solid-accent-box p, .solid-accent-box i, .solid-accent-box span {
            color: #050505 !important; text-shadow: none !important;
        }

        /* --- SPEAKING HUB --- */
        .speaking-hub {
            margin-top: 40px; padding: 35px; background: rgba(168, 85, 247, 0.08);
            border-radius: 16px; border: 1px solid var(--accent-glow); position: relative;
            box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.05);
        }
        .speaking-hub::before {
            content: '🎙️ SYSTEM.OUT.SPEAK()'; position: absolute; top: -14px; left: 30px;
            background: var(--accent); color: #000; font-family: var(--font-code); font-size: 0.75rem;
            font-weight: 700; padding: 6px 16px; border-radius: 8px; letter-spacing: 1px;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .speaking-hub p { color: #fff; font-weight: 600; font-size: 1.3rem; margin-bottom: 15px; }
        
        .speaking-starters-container { display: flex; flex-wrap: wrap; gap: 12px; }
        .speaking-starter {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; user-select: none; font-family: var(--font-code);
        }
        .speaking-starter:hover, .speaking-starter.active { background: var(--accent); color: #000; border-color: var(--accent); transform: translateY(-2px); }

        /* --- INTERACTIVE MODULES --- */
        .list-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .list-item {
            padding: 20px 30px; background: rgba(255,255,255,0.03); border-radius: 12px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; color: #fff;
        }
        .list-item:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); transform: translateX(10px); }

        .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .choice-card { padding: 30px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.03); border-radius: 16px; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2);}
        .choice-card:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 15px 30px rgba(168,85,247,0.2);}
        .choice-card h3 { font-family: var(--font-body); font-size: 1.4rem; margin-bottom: 10px; color: #fff;}
        .choice-card p { font-size: 1rem; color: var(--text-dim); margin: 0;}
        .choice-card i { font-size: 3rem; color: var(--accent); display: block; margin-bottom: 15px; transition: transform 0.3s;}
        .choice-card:hover i { transform: scale(1.1); }

        .vocab-word { color: var(--accent); font-weight: 800; cursor: pointer; border-bottom: 2px dashed var(--accent); padding-bottom: 2px; transition: 0.3s;}
        .vocab-word:hover { color: #fff; border-color: #fff; text-shadow: 0 0 15px var(--accent-glow);}

        /* Text Analysis Blocks */
        .text-reading { background: rgba(255,255,255,0.03); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); font-size: 1.25rem; line-height: 1.8; color: #EBEBEB; font-family: var(--font-code);}
        .highlight-zone { padding: 35px; background: rgba(255,255,255,0.02); border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); text-align: center; font-size: 1.5rem; line-height: 1.8; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);}

        /* Error Finder */
        .error-sentence { font-size: 1.8rem; word-spacing: 5px; line-height: 2; font-weight: 600; text-align: center;}
        .error-word { display: inline-block; padding: 5px 10px; cursor: pointer; border-radius: 8px; transition: 0.2s; border: 1px solid transparent;}
        .error-word:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);}

        /* SENTENCE BUILDER */
        .drop-zone { min-height: 120px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; padding: 20px; gap: 12px; flex-wrap: wrap; background: rgba(0, 0, 0, 0.4); transition: 0.3s;}
        .drop-zone.success { border-color: var(--correct); border-style: solid; background: rgba(29, 185, 84, 0.1); box-shadow: inset 0 0 30px rgba(29,185,84,0.15); }
        .word-bank { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        
        .word-chip { 
            padding: 14px 28px; background: var(--accent); border-radius: 8px; 
            cursor: pointer; user-select: none; transition: all 0.3s; font-weight: 800; 
            border: none; color: #000; font-size: 1.1rem; box-shadow: 0 5px 15px var(--accent-glow); font-family: var(--font-code);
        }
        .word-chip:hover { filter: brightness(1.2); transform: translateY(-4px); box-shadow: 0 8px 20px var(--accent-glow); }
        .word-chip.used { opacity: 0; pointer-events: none; transform: scale(0.8); }

        /* Chat Scenario (Terminal Style) */
        .chat-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; font-family: var(--font-code);}
        .msg { padding: 18px 25px; border-radius: 12px; max-width: 85%; font-size: 1.1rem; line-height: 1.5; text-align: left;}
        .msg.friend { background: rgba(0,0,0,0.5); align-self: flex-start; border-bottom-left-radius: 4px; color: var(--accent); border: 1px solid var(--border); }
        .msg.you { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; display: none; font-weight: 700; box-shadow: 0 5px 15px var(--accent-glow);}
        .msg-name { font-size: 0.8rem; font-weight: 800; color: #fff; letter-spacing: 1px; display: block; margin-bottom: 5px; text-transform: uppercase;}
        .msg.you .msg-name { color: #121212; }
        .chat-option { padding: 18px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; text-align: left; color: #fff; font-weight: 700; border: 1px solid rgba(255,255,255,0.15); transition: 0.3s;}
        .chat-option:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); transform: translateX(5px); color: var(--accent);}

        /* Toggle Rows */
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 25px; margin-bottom: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; font-weight: 600; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; color: #fff;}
        .toggle-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: 800; transition: 0.3s;}
        .toggle-btn:hover { background: rgba(255,255,255,0.15); }
        .toggle-btn.correct { background: var(--correct); color: #000; border-color: var(--correct); }
        .toggle-btn.incorrect { background: var(--incorrect); color: #fff; border-color: var(--incorrect); }

        /* --- THE ARENA --- */
        .arena-grid { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;}
        .arena-card { width: 280px; height: 380px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; position: relative; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);}
        .arena-card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; border-radius: 24px; }
        .card-front { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 5rem; color: var(--accent); backdrop-filter: blur(10px);}
        .card-back { background: var(--accent); transform: rotateY(180deg); color: #050505; border: none; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        .card-back h3 { color: #050505; font-family: var(--font-display); font-size: 2.2rem; margin-bottom: 10px; text-shadow: none;}
        .card-back p { color: #050505; font-weight: 600; font-size: 1.1rem; }

        /* Video Wrapper */
        .video-wrapper { position: relative; aspect-ratio: 16/9; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid var(--border);}
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- HEADERS & FOOTERS --- */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 90px; padding: 0 40px;
            display: flex; align-items: center; justify-content: space-between; z-index: 100;
            background: linear-gradient(to bottom, rgba(3,0,8,0.95), transparent);
        }
        .logo { font-family: var(--font-code); font-weight: 900; font-size: 1.1rem; color: #fff; letter-spacing: 2px;}
        .logo span { color: var(--accent); }
        .level-badge { background: var(--accent); color: #000; font-family: var(--font-code); padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 900; margin-left: 10px; letter-spacing: 1px; vertical-align: middle;}

        .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.05); }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s ease; box-shadow: 0 0 15px var(--accent-glow); }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 100px; padding: 0 50px;
            background: linear-gradient(to top, rgba(3,0,8,1), rgba(3,0,8,0.8)); border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between; z-index: 90; backdrop-filter: blur(20px);
        }

        .controls { display: flex; gap: 15px; }
        .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--accent); width: 50px; height: 50px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; backdrop-filter: blur(10px); font-size: 1.1rem; }
        .icon-btn:hover { background: var(--accent); color: #000; transform: translateY(-2px); border-color: var(--accent);}

        /* --- ASIDE PANELS --- */
        .vocab-panel {
            position: fixed; top: 0; right: -550px; width: 500px; height: 100vh;
            background: linear-gradient(135deg, rgba(15, 5, 30, 0.95) 0%, rgba(5, 0, 10, 0.98) 100%);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); z-index: 200;
            padding: 80px 45px; border-left: 1px solid var(--border); 
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            transition: right 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column; gap: 25px; overflow-y: auto;
        }
        .vocab-panel.open { right: 0; }
        .vocab-close { position: absolute; top: 30px; right: 30px; color: #fff; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); width: 45px; height: 45px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.3s;}
        .vocab-close:hover { background: var(--incorrect); border-color: var(--incorrect); transform: rotate(90deg); color: #fff;}

        .whiteboard-panel { position: fixed; bottom: 110px; right: 40px; width: 450px; height: 500px; background: rgba(5,0,15,0.95); border: 1px solid var(--border); border-radius: 16px; z-index: 101; transform: translateY(120%) scale(0.9); display: flex; flex-direction: column; transition: all 0.5s cubic-bezier(0.3, 0, 0, 1); box-shadow: 0 30px 60px rgba(0,0,0,0.9); backdrop-filter: blur(30px); opacity: 0;}
        .whiteboard-panel.open { transform: translateY(0) scale(1); opacity: 1;}
        .wb-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-code); font-size: 1rem; color: #fff; letter-spacing: 1px;}
        .wb-content { flex: 1; padding: 25px; outline: none; color: var(--accent); font-family: var(--font-code); font-size: 1.1rem; resize: none; border: none; background: transparent; line-height: 1.8;}

    </style>
</head>
<body>

    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <header class="header">
        <div class="logo"><i class="fa-solid fa-code" style="color:var(--accent); margin-right:8px;"></i> WOLF LABS <span>|</span> ENGLISH FOR TECH <div class="level-badge">A2</div></div>
        <div class="controls">
            <button class="icon-btn" onclick="toggleWhiteboard()" title="System Terminal"><i class="fa-solid fa-terminal"></i></button>
            <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen Mode"><i class="fa-solid fa-expand"></i></button>
        </div>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    </header>

    <main id="main-container"></main>

    <nav class="nav-bar">
        <button class="btn" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff;" id="prevBtn" onclick="prevStep()" disabled><i class="fa-solid fa-arrow-left"></i> BACK</button>
        <div style="font-family: var(--font-code); font-weight: 700; font-size: 1rem; color: var(--text-dim); letter-spacing: 2px;" id="step-counter">init_sequence(1/23)</div>
        <button class="btn btn-accent" id="nextBtn" onclick="nextStep()">EXECUTE_NEXT() <i class="fa-solid fa-arrow-right"></i></button>
    </nav>

    <aside class="vocab-panel" id="vocabPanel">
        <button class="vocab-close" onclick="closeVocab()"><i class="fa-solid fa-xmark"></i></button>
        <div id="asideContent">
            <p class="code-tag" style="margin-bottom: 10px; display: inline-block;">// TECH_GLOSSARY</p>
            <h2 id="vocab-title" style="font-size: 2.5rem; margin-bottom: 20px; color:#fff; font-family: var(--font-code);">Term</h2>
            <div class="glass-panel" style="padding: 30px; text-align: left; margin-bottom: 25px; border-radius: 16px; border-color: rgba(168, 85, 247, 0.3);">
                <p style="color: var(--accent); font-weight: 800; font-family: var(--font-code); margin-bottom: 10px; font-size: 0.85rem;">[DEFINITION]</p>
                <p id="vocab-def" style="color: #fff; margin-bottom: 25px; font-size: 1.1rem; line-height: 1.6;">Definition text here.</p>
                <p style="color: var(--text-dim); font-weight: 800; font-family: var(--font-code); margin-bottom: 10px; font-size: 0.85rem;">[SYSTEM_LOG]</p>
                <p id="vocab-ex" style="font-family: var(--font-code); color: var(--text-dim); font-size: 1rem; line-height: 1.6;">> "Example sentence here."</p>
            </div>
            <div class="speaking-hub solid-accent-box" style="margin-top: 0;">
                <p id="vocab-speak" style="font-size:1.15rem;">Follow up question?</p>
            </div>
        </div>
    </aside>

    <aside class="whiteboard-panel" id="whiteboardPanel">
        <div class="wb-header"><span><i class="fa-solid fa-terminal" style="color:var(--accent); margin-right: 10px;"></i> admin@wolflabs:~</span><button class="vocab-close" style="position:static; width: 35px; height: 35px;" onclick="toggleWhiteboard()"><i class="fa-solid fa-xmark"></i></button></div>
        <textarea class="wb-content" placeholder="> Type whiteboard notes, architecture diagrams, or grammar corrections here..."></textarea>
    </aside>

    <script>
        // --- 1. VOCAB DATA (Tech Glossary for Non-Tech Teachers & Students) ---
        const vocabData = {
            'hardware': { def: 'The physical parts of a computer (mouse, screen, motherboard).', ex: 'They needed to buy new hardware for the office.', speak: 'What was the last piece of hardware you bought?' },
            'mainframe': { def: 'A massive computer from the 1960s used by large companies.', ex: 'In the 1960s, a mainframe filled an entire room.', speak: 'Imagine working with a computer the size of a room. How difficult was it?' },
            'floppy disk': { def: 'An old storage device that held very little memory (the "Save" icon).', ex: 'We saved our school projects on floppy disks.', speak: 'Did you ever use a floppy disk, or are you too young for that?' },

                <p style="text-align:center; font-size:1.2rem; margin-bottom: 40px;">Flip a card. Give your simple opinion for 30 seconds.</p>
                <div class="arena-grid">
                    <div class="arena-card" onclick="flipCard(this, 'p18')">
                        <div class="card-inner">
                            <div class="card-front"><i class="fa-solid fa-mobile-screen-button"></i></div>

                    <div class="arena-card" onclick="flipCard(this, 'p18')">
                        <div class="card-inner">
                            <div class="card-front"><i class="fa-solid fa-compact-disc"></i></div>

                        </div>
                    </div>
                </div>
                <div class="speaking-hub" id="p18" style="display:none; text-align: left; max-width: 800px; margin: 40px auto 0 auto;"><p>Teacher, evaluate the student's use of Past Simple (used, had, bought, went).</p></div>
            </div>`,

            // 19: THE ARENA 2
            `<div>
                <h2 style="text-align:center; font-size:3rem;"><i class="fa-solid fa-trophy"></i> The Tech Arena (Phase 2)</h2>
                <p style="text-align:center; font-size:1.2rem; margin-bottom: 40px;">More advanced tech questions.</p>
                <div class="arena-grid">
                    <div class="arena-card" onclick="flipCard(this, 'p19')">
                        <div class="card-inner">
                            <div class="card-front"><i class="fa-solid fa-gamepad"></i></div>
                            <div class="card-back solid-accent-box"><h3>Gaming</h3><p>Were old video games better than modern ones?</p></div>
                        </div>
                    </div>
                    <div class="arena-card" onclick="flipCard(this, 'p19')">
                        <div class="card-inner">
                            <div class="card-front"><i class="fa-solid fa-users"></i></div>
                            <div class="card-back solid-accent-box"><h3>Social Life</h3><p>Did people talk more to each other before smartphones?</p></div>
                        </div>
                    </div>
                </div>
                <div class="speaking-hub" id="p19" style="display:none; text-align: left; max-width: 800px; margin: 40px auto 0 auto;"><p>Encourage the student to use full sentences to express their opinion.</p></div>
            </div>`,

            // 20: RAPID TRANSFORMATION (Negative Past)
            `<div class="glass-panel">
                <h2><i class="fa-solid fa-forward-fast"></i> Rapid Code Transformation</h2>
                <p>Transform this Positive Past sentence into a <strong>Negative Past</strong> sentence.</p>
                <div class="highlight-zone" style="text-align:center; font-size:1.8rem; padding:40px; border-color: var(--accent); font-family:var(--font-code);">
                    "They had fast internet in 1995."
                </div>
                <br>
                <button class="btn btn-accent" onclick="this.style.display='none'; unlockPrompt('p20')"><i class="fa-solid fa-eye"></i> Execute</button>
                <div class="speaking-hub" id="p20" style="display:none;"><p>"They didn't have fast internet in 1995." - Great! Now transform: "He bought a new laptop."</p></div>
            </div>`,

            // 21: FINAL TASK
            `<div>
                <h2 style="text-align:center; font-size:3.5rem;"><i class="fa-solid fa-rocket"></i> The Final Pitch</h2>
                <p style="text-align:center; font-size:1.3rem;">You have 60 seconds. Explain to a child how technology was different 30 years ago.</p>
                <div class="choice-grid" style="max-width: 800px; margin: 40px auto;">
                    <div class="choice-card" onclick="genericCorrect(this, false)"><h3 style="font-family:var(--font-body);"><i class="fa-solid fa-hand"></i> I need a second.</h3></div>
                    <div class="choice-card" onclick="genericCorrect(this, true, 'p21')"><h3 style="font-family:var(--font-body);"><i class="fa-solid fa-terminal"></i> I'm ready! Let's talk.</h3></div>
                </div>
                <div class="speaking-hub" id="p21" style="display:none;"><p>Go! Talk about the size of computers, how we saved things, and the internet! Use the Past Simple.</p></div>
            </div>`,

            // 22: END
            `<div class="glass-panel" style="text-align: center; border: 1px solid var(--correct); background: rgba(29, 185, 84, 0.05); padding: 60px;">
                <i class="fa-solid fa-circle-check" style="font-size: 5rem; color: var(--correct); margin-bottom: 20px;"></i>
                <h1 style="color: var(--correct); font-size:4rem; text-shadow:none;">Session Terminated</h1>
                <p style="font-size: 1.4rem; font-weight: 600;">The A2 Tech Module has been successfully completed.</p>
                <div style="text-align: left; background: rgba(0,0,0,0.5); padding: 40px; border-radius: 16px; margin: 40px auto; max-width: 600px; border: 1px solid rgba(168,85,247,0.3);">
                    <h3 style="color: var(--accent); margin-bottom: 20px; font-size: 1.5rem; font-family:var(--font-code);"><i class="fa-solid fa-database"></i> console.log("Data Saved")</h3>
                    <ul style="list-style: none; color: #fff; line-height: 2.2; font-weight: 600; font-size: 1.2rem;">
                        <li><i class="fa-solid fa-check" style="color:var(--accent); margin-right:10px;"></i> Tech Vocab: Mainframe, Cloud, Crash, Floppy Disk</li>
                        <li><i class="fa-solid fa-check" style="color:var(--accent); margin-right:10px;"></i> Grammar: Simple Past (Regular vs Irregular)</li>
                        <li><i class="fa-solid fa-check" style="color:var(--accent); margin-right:10px;"></i> Grammar: Did / Didn't Syntax</li>
                        <li><i class="fa-solid fa-check" style="color:var(--accent); margin-right:10px;"></i> Speaking: Comparing Past & Present Tech</li>
                    </ul>
                </div>
            </div>`
        ];

        // --- CORE LOGIC ---
        let currentStep = 0;
        const totalSteps = stepsData.length;
        const mainContainer = document.getElementById('main-container');

        function initializeSteps() {
            mainContainer.innerHTML = '';
            stepsData.forEach((htmlContent, index) => {
                const section = document.createElement('section');
                section.className = 'step';
                section.id = `step-${index}`;
                section.innerHTML = htmlContent;
                mainContainer.appendChild(section);
            });
            updateUI();
        }

        function updateUI() {
            const steps = document.querySelectorAll('.step');
            steps.forEach((step, index) => {
                if(index === currentStep) step.classList.add('active');
                else step.classList.remove('active');
            });

            document.getElementById('prevBtn').disabled = currentStep === 0;
            document.getElementById('nextBtn').style.display = currentStep === steps.length - 1 ? 'none' : 'block';
            document.getElementById('step-counter').innerText = `init_sequence(${currentStep + 1}/${steps.length})`;
            
            const pb = document.getElementById('progressBar');
            if (pb) {
                const progress = ((currentStep + 1) / steps.length) * 100;
                pb.style.width = `${progress}%`;
            }
            
            mainContainer.scrollTo(0, 0);
        }

        function nextStep() { 
            const steps = document.querySelectorAll('.step');
            if (currentStep < steps.length - 1) { 
                currentStep++; 
                updateUI(); 
                closeVocab(); 
            } 
        }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); closeVocab(); } }

        function unlockPrompt(id) { const p = document.getElementById(id); if(p) p.style.display = 'block'; }

        function selectCard(card, selector) {
            const parent = card.closest(selector) || card.parentElement;
            parent.querySelectorAll('.choice-card').forEach(el => { el.style.opacity = '0.4'; el.style.borderColor = 'rgba(255,255,255,0.05)'; });
            card.style.opacity = '1'; card.style.borderColor = 'var(--accent)';
        }

        function genericCorrect(btn, isCorrect, promptIdStr) {
            const parent = btn.parentElement;
            let attempts = parseInt(parent.dataset.attempts || '0');
            const options = Array.from(parent.querySelectorAll('div, button, span')).filter(b => b.hasAttribute('onclick') && b.getAttribute('onclick').includes('genericCorrect'));
            const maxAttempts = Math.min(3, options.length - 1);
            
            let promptIdToUnlock = promptIdStr;

            if(isCorrect) {
                options.forEach(b => b.style.pointerEvents = 'none');
                btn.style.backgroundColor = 'var(--correct)'; btn.style.color = '#000'; btn.style.borderColor = 'var(--correct)';
                if (promptIdToUnlock) unlockPrompt(promptIdToUnlock);
            } else {
                attempts++; parent.dataset.attempts = attempts;
                btn.style.backgroundColor = 'var(--incorrect)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--incorrect)'; btn.style.animation = 'shake 0.4s'; btn.style.pointerEvents = 'none';
                if (attempts >= maxAttempts) {
                    options.forEach(b => b.style.pointerEvents = 'none');
                    const correctBtn = options.find(b => b.getAttribute('onclick') && b.getAttribute('onclick').includes('true'));
                    if (correctBtn) { correctBtn.style.backgroundColor = 'var(--correct)'; correctBtn.style.color = '#000'; correctBtn.style.borderColor = 'var(--correct)'; }
                    if (promptIdToUnlock) setTimeout(() => unlockPrompt(promptIdToUnlock), 500);
                }
            }
        }

        function checkTrueFalse(btn, isCorrect, promptId) {
            const parent = btn.parentElement;
            let attempts = parseInt(parent.dataset.attempts || '0');
            const options = Array.from(parent.querySelectorAll('button'));
            
            if (isCorrect) {
                options.forEach(o => o.style.pointerEvents = 'none');
                btn.style.backgroundColor = 'var(--correct)'; btn.style.color = '#000'; btn.style.borderColor = 'var(--correct)';
                unlockPrompt(promptId);
            } else {
                attempts++; parent.dataset.attempts = attempts;
                btn.style.backgroundColor = 'var(--incorrect)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--incorrect)'; btn.style.animation = 'shake 0.4s'; btn.style.pointerEvents = 'none';
                if (attempts >= 1) {
                    options.forEach(o => o.style.pointerEvents = 'none');
                    const correctBtn = options.find(b => b.getAttribute('onclick') && b.getAttribute('onclick').includes('true'));
                    if(correctBtn) { correctBtn.style.backgroundColor = 'var(--correct)'; correctBtn.style.color = '#000'; correctBtn.style.borderColor = 'var(--correct)'; }
                    setTimeout(() => unlockPrompt(promptId), 500);
                }
            }
        }

        let buildState = {};
        function moveWord(chip, dzId, targetArray, promptId) {
            if(chip.classList.contains('used')) return;
            
            const word = chip.innerText;
            const dz = document.getElementById(dzId);
            
            const newChip = document.createElement('div');
            newChip.className = 'word-chip'; 
            newChip.innerText = word;
            
            if (!chip.id) chip.id = 'chip_' + Math.random().toString(36).substr(2, 9);
            newChip.dataset.sourceId = chip.id;
            newChip.onclick = function() {
                if(dz.classList.contains('success')) return;
                dz.removeChild(this);
                document.getElementById(this.dataset.sourceId).classList.remove('used');
                const idx = buildState[dzId].lastIndexOf(this.innerText);
                if(idx !== -1) buildState[dzId].splice(idx, 1);
            };

            dz.appendChild(newChip); chip.classList.add('used');
            if(!buildState[dzId]) buildState[dzId] = [];
            buildState[dzId].push(word);

            if(buildState[dzId].length === targetArray.length) {
                if(JSON.stringify(buildState[dzId]) === JSON.stringify(targetArray)) {
                    dz.classList.add('success'); 
                    Array.from(dz.children).forEach(c => { c.style.background = 'var(--correct)'; c.style.color = '#000'; c.style.cursor = 'default'; c.style.borderColor = 'var(--correct)'; c.style.boxShadow = 'none';});
                    unlockPrompt(promptId);
                } else {
                    let attempts = parseInt(dz.dataset.attempts || '0') + 1;
                    dz.dataset.attempts = attempts;
                    dz.style.borderColor = 'var(--incorrect)'; dz.style.animation = 'shake 0.4s';
                    
                    if (attempts >= 3) {
                        setTimeout(() => {
                            dz.innerHTML = ''; dz.style.borderColor = ''; dz.style.animation = ''; dz.classList.add('success');
                            targetArray.forEach(w => {
                                const finalChip = document.createElement('div');
                                finalChip.className = 'word-chip'; finalChip.style.background = 'var(--correct)'; finalChip.style.color = '#000'; finalChip.style.borderColor = 'var(--correct)'; finalChip.innerText = w; finalChip.style.boxShadow = 'none';
                                dz.appendChild(finalChip);
                            });
                            chip.parentElement.querySelectorAll('.word-chip').forEach(c => c.classList.add('used'));
                            setTimeout(() => unlockPrompt(promptId), 500);
                        }, 1000);
                    } else {
                        setTimeout(() => {
                            dz.innerHTML = ''; dz.style.borderColor = 'rgba(255,255,255,0.2)'; dz.style.animation = ''; buildState[dzId] = [];
                            chip.parentElement.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
                        }, 1000);
                    }
                }
            }
        }

        function handleChat(btn, isCorrect, containerId, promptId) {
            const container = document.getElementById(containerId);
            let attempts = parseInt(container.dataset.attempts || '0');
            const options = Array.from(container.querySelectorAll('.chat-option'));
            const maxAttempts = Math.min(3, options.length - 1);

            if(isCorrect) {
                options.forEach(b => b.style.pointerEvents = 'none');
                btn.style.backgroundColor = 'var(--correct)'; btn.style.color = '#000'; btn.style.borderColor = 'var(--correct)';
                setTimeout(() => { container.innerHTML = `<div class="msg you" style="display:block;">${btn.innerText}</div>`; unlockPrompt(promptId); }, 800);
            } else {
                attempts++; container.dataset.attempts = attempts;
                btn.style.backgroundColor = 'var(--incorrect)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--incorrect)'; btn.style.animation = 'shake 0.4s'; btn.style.pointerEvents = 'none';
                if (attempts >= maxAttempts) {
                    const correctBtn = options.find(b => b.getAttribute('onclick').includes('true'));
                    options.forEach(b => b.style.pointerEvents = 'none');
                    if (correctBtn) {
                        correctBtn.style.backgroundColor = 'var(--correct)'; correctBtn.style.color = '#000'; correctBtn.style.borderColor = 'var(--correct)';
                        setTimeout(() => { container.innerHTML = `<div class="msg you" style="display:block;">${correctBtn.innerText}</div>`; unlockPrompt(promptId); }, 1000);
                    }
                }
            }
        }

        let matchS1 = null; let matchesF1 = 0;
        function handleMatch(card, matchVarName, matchesFoundVarName, targetMatches, promptId) {
            if(card.style.opacity === '0') return;
            if(!window[matchVarName]) { window[matchVarName] = card; card.style.borderColor = 'var(--accent)'; }
            else {
                if(window[matchVarName].dataset.val === card.dataset.val && window[matchVarName] !== card) { 
                    window[matchVarName].style.opacity = '0'; card.style.opacity = '0'; 
                    window[matchesFoundVarName]++;
                    if(window[matchesFoundVarName] === targetMatches) unlockPrompt(promptId);
                } else { 
                    window[matchVarName].style.borderColor = 'rgba(255,255,255,0.05)'; card.style.animation = 'shake 0.4s'; 
                    setTimeout(() => card.style.animation = '', 400);
                }
                window[matchVarName] = null;
            }
        }

        function flipCard(card, promptId) {
            if(!card.classList.contains('flipped')) {
                card.classList.add('flipped');
                unlockPrompt(promptId);
            }
        }

        const roles = [
            "A person who misses the 1990s and hates modern smartphones.",
            "A teenager who has never seen a floppy disk in their life.",
            "A technical support worker from the year 1999."
        ];
        function generateRole(promptId) {
            document.getElementById('role-box').innerText = roles[Math.floor(Math.random()*roles.length)];
            unlockPrompt(promptId);
        }

        function openVocab(word, promptId) {
            const data = vocabData[word];
            if(data) { 
                document.getElementById('vocab-title').innerText = word; 
                document.getElementById('vocab-def').innerText = data.def; 
                document.getElementById('vocab-ex').innerText = `> "${data.ex}"`; 
                document.getElementById('vocab-speak').innerText = data.speak; 
            }
            document.getElementById('vocabPanel').classList.add('open');
            if (promptId) unlockPrompt(promptId);
        }
        function closeVocab() { document.getElementById('vocabPanel').classList.remove('open'); }
        function toggleWhiteboard() { document.getElementById('whiteboardPanel').classList.toggle('open'); }
        function toggleFullscreen() { 
            try {
                if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); } 
                else { document.exitFullscreen(); }
            } catch (err) {}
        }

        window.onload = initializeSteps;
    </script>
</body>
